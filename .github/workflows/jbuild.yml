name: Build Valence (Pure Java)

on:
  push:
    branches: [ master, develop-gedcom ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Clean Gradle cache and build
      run: |
        echo "=== Cleaning Gradle caches ==="
        ./gradlew clean
        rm -rf ~/.gradle/caches/
        echo "=== Clean complete ==="
    
    - name: Build with Gradle (refresh dependencies)
      run: |
        echo "=== Building with fresh dependencies ==="
        ./gradlew assembleDebug --refresh-dependencies --no-daemon
        echo "=== Build complete ==="
    
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: valence-debug-pure-java
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

  build-release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Clean and build Release APK
      run: |
        echo "=== Cleaning and building Release ==="
        ./gradlew clean
        ./gradlew assembleRelease --no-daemon
        echo "=== Build complete ==="
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: app/build/outputs/apk/release/*.apk
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Run tests
      run: |
        echo "=== Running tests ==="
        ./gradlew test --no-daemon
        echo "=== Tests complete ==="
    
    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: app/build/reports/tests/
        retention-days: 7
