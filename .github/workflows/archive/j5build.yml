name: Build Valence

on:
  push:
    branches: [ master, develop-gedcom ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v5  # Updated to v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'  # Built-in caching!
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Clean and Build
      run: |
        ./gradlew clean
        ./gradlew assembleDebug --no-daemon

    - name: Run app and capture logs
      if: always()
      run: |
        adb logcat -d > full_log.txt
        cat full_log.txt | grep -E "AndroidRuntime|FATAL|Exception|Valence"
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: valence-debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
